[project]
name = "digikala-review-transformer"
version = "0.1.0"
description = "Persian Digikala review classification: TF-IDF baseline vs fine-tuned Transformer"
readme = "README.md"
authors = [
    { name = "AliirezzaaZiarati", email = "arzxii1998@gmail.com" }
]
requires-python = ">=3.12"

# Training dependencies only: this is everything the training machine needs
dependencies = [
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "protobuf",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentencepiece",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
# Analysis, charts and data-preparation tools (not needed on the training machine)
analysis = [
    "arabic-reshaper>=3.1.0",
    "duckdb>=2.0.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "parsivar>=0.2.3.1",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "psutil>=7.2.2",
    "python-bidi>=0.6.12",
    "scipy>=1.18.1",
    "torchvision>=0.29.2",
]

[tool.uv]
# On your machine a plain `uv sync` installs everything, as before
default-groups = ["dev", "analysis"]

# CUDA wheels of torch and torchvision on Windows only (both from the same index)
[tool.uv.sources]
torch = [{ index = "pytorch-cu134", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu134", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true