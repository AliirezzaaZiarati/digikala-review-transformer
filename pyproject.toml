[project]
name = "digikala-review-transformer"
version = "0.1.0"
description = "Persian Digikala review classification: TF-IDF baseline vs fine-tuned Transformer"
readme = "README.md"
authors = [
    { name = "AliirezzaaZiarati", email = "arzxii1998@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arabic-reshaper>=3.1.0",
    "duckdb>=2.0.0",
    "huggingface-hub>=2.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
    "parsivar>=0.2.3.1",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "python-bidi>=0.6.12",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
