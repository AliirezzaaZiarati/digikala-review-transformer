[project]
name = "digikala-review-transformer"
version = "0.1.0"
description = "Persian Digikala review classification: TF-IDF baseline vs fine-tuned Transformer"
readme = "README.md"
authors = [
    { name = "AliirezzaaZiarati", email = "arzxii1998@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "parsivar>=0.2.3.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
