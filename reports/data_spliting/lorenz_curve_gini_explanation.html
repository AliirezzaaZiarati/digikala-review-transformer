<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Shape of Inequality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3ECDD;--card:#FBF7EE;--ink:#16130F;--blue:#2A3DDB;--red:#EA4B2A;--redd:#C73A1B;--gold:#FFB81F;--grid:#D8CDB5;--gr:#5A5348;--e:cubic-bezier(.77,0,.18,1);--s:cubic-bezier(.2,.9,.2,1);--sw:min(74dvh,46vw);--d:'Bricolage Grotesque','Arial Narrow',Impact,sans-serif;--m:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--paper) radial-gradient(var(--grid) 1px,transparent 1.4px) 0 0/14px 14px;color:var(--ink);font:400 1.125rem/1.65 'DM Sans',system-ui,sans-serif;transition:background-color 1s}
body.dk{background-color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);box-shadow:0 0 0 6px var(--ink)}
.sh{position:fixed;transition:all 1.2s var(--e);z-index:0}
#s1{border-radius:50%}#s2{border-radius:999px 999px 0 0}#s3{clip-path:polygon(50% 0,100% 100%,0 100%)}
#app{position:relative;z-index:1;height:100dvh}
#big{position:absolute;right:2vw;bottom:-4vw;font:800 clamp(10rem,28vw,26rem)/1 var(--d);color:transparent;-webkit-text-stroke:3px var(--ink);opacity:.14;pointer-events:none}
.stage{position:absolute;z-index:2;display:flex;flex-direction:column;gap:8px;padding:14px;width:var(--sw);height:var(--sw);background:var(--card);border:4px solid var(--ink);box-shadow:14px 14px 0 var(--c,var(--gold));transition:all .9s var(--e)}
.cap{position:absolute;z-index:3;width:min(460px,86vw);transition:all .9s var(--e)}
#app[data-l=A] .stage{left:calc(93vw - var(--sw));top:9dvh}
#app[data-l=A] .cap{left:90px;top:44dvh}
#app[data-l=B] .stage{left:max(100px,9vw);top:9dvh}
#app[data-l=B] .cap{left:calc(95vw - min(460px,86vw));top:16dvh}
#app[data-l=C] .stage{left:max(90px,calc(50vw - 440px));top:6dvh;width:min(86vw,880px);height:min(56dvh,520px)}
#app[data-l=C] .cap{left:calc(96vw - min(460px,86vw));top:63dvh}
.cap.hero{width:min(900px,70vw)}
.cap.hero h2{font-size:clamp(3.2rem,8vw,8rem)}
.k{display:inline-block;background:var(--paper);padding:2px 8px;font:500 12px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--gr)}
#dots i{display:inline-block;width:9px;height:9px;border:2px solid var(--ink);margin-left:4px}
#dots i.on{background:var(--ink)}
.cap h2{display:block;width:fit-content;position:relative;margin:.25em 0 .35em;padding:.12em .3em;background:var(--ink);color:var(--paper);font:800 clamp(2rem,4.5vw,4rem)/.98 var(--d)}
body.dk .cap h2{background:var(--gold);color:var(--ink)}
#app[data-l=A] .cap h2{left:40px}#app[data-l=B] .cap h2{left:-40px}
#tx{background:var(--paper);border-left:6px solid var(--red);padding:14px 18px;max-width:52ch}
#tx small{display:block;font-size:15px;color:var(--gr);margin-top:8px}
#tx code{font:500 .85em var(--m);background:var(--gold);padding:0 5px}
.up{animation:up .7s var(--s) both}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
@keyframes fi{from{opacity:0}}
.fi{animation:fi .9s .5s both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s var(--e) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.fl{flex:1;min-height:0;position:relative}
.fl svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font:500 15px var(--m);fill:#16130F}
svg .at{font-size:14px;letter-spacing:.08em;fill:#5A5348}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 13px var(--m)}
.ctl label{display:flex;flex:1;gap:8px;align-items:center;min-width:200px}
.chip{min-height:44px;padding:0 14px;border:3px solid var(--ink);background:var(--card);font:500 13px var(--m);text-transform:uppercase;transition:transform .3s var(--s),box-shadow .3s,background .3s}
.chip:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.chip.on{background:var(--ink);color:var(--gold)}
input[type=range]{flex:1;min-width:120px;height:44px;accent-color:var(--red)}
.ro{background:var(--ink);color:var(--gold);padding:8px 12px;min-height:38px;font:500 14px/1.4 var(--m);white-space:pre-wrap}
.gn{position:absolute;left:19%;top:5%;padding:0 .15em;background:var(--gold);border:4px solid var(--ink);font:800 clamp(3rem,6vw,5.5rem)/1.05 var(--d);pointer-events:none;transition:opacity .5s}
.vil{flex:1;position:relative;display:flex;gap:6px;min-height:0}
.vl{position:relative;flex:1}
.co{position:absolute;left:0;right:0;bottom:36px;height:calc((100% - 44px)*var(--n)/55);background:repeating-linear-gradient(0deg,var(--gold) 0 5px,var(--ink) 5px 7px);border:2px solid var(--ink);transition:height 1s var(--s)}
.co.z{border:0}
.pp{position:absolute;bottom:0;left:50%;width:26px;height:32px;transform:translateX(-50%);background:radial-gradient(circle at 50% 28%,var(--blue) 0 7px,transparent 7.5px),linear-gradient(var(--blue),var(--blue)) 50% 100%/22px 16px no-repeat;border-radius:0 0 4px 4px}
.avg{position:absolute;left:0;right:0;bottom:calc(36px + (100% - 44px)*10/55);border-top:3px dashed var(--ink);pointer-events:none}
.avg span{position:absolute;right:0;top:-24px;background:var(--card);font:500 13px var(--m);padding:0 4px}
.bars{position:relative;flex:0 0 22%}
.br{position:absolute;bottom:0;width:8%;left:calc(var(--x)*10% + 1%);height:calc(var(--h)/55*100%);min-height:3px;background:var(--grid);border:2px solid var(--ink);transition:left .9s var(--s),background .3s}
.br.f{background:var(--gold)}
.row{flex:0 0 20%;display:flex;align-items:flex-end;gap:2px}
.row i{flex:1;height:calc(var(--h)*1%);min-height:2px;background:var(--gold);border:2px solid var(--ink);transition:height .5s var(--s)}
.row2{flex:1;display:flex;gap:12px;min-height:0}
.tw{flex:1.1;overflow:auto}
.t{border-collapse:collapse;width:100%;font:500 15px var(--m)}
.t th,.t td{border:2px solid var(--ink);padding:7px 6px;text-align:center;transition:opacity .5s,background .4s}
.t th{background:var(--ink);color:var(--paper)}
.t td.hl{background:var(--gold)}
.g{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;overflow:auto;align-content:start}
.cd{border:3px solid var(--ink);padding:10px 12px;background:var(--card);font-size:16px;line-height:1.45;box-shadow:6px 6px 0 var(--blue)}
.cd.tr{box-shadow:6px 6px 0 var(--red)}
.cd h4{font:800 1.15rem var(--d)}
.r{color:var(--redd)}.bl{color:var(--blue)}
.tabs{width:36%;display:flex;flex-direction:column;gap:8px}
.tb{text-align:left;border:3px solid var(--ink);padding:10px 12px;background:var(--card);font:500 15px/1.35 var(--m);transition:all .3s var(--s)}
.tb b{display:block;font:800 18px var(--d)}
.tb.on{background:var(--blue);color:#fff;transform:translateX(8px)}
.col{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.code{flex:1;min-height:0;overflow:auto;background:var(--ink);color:#EDE6D4;padding:14px;font:400 15px/1.6 var(--m)}
.code .k{color:#FF7A5C;background:none;padding:0;letter-spacing:0;font:inherit;text-transform:none}
.code .s{color:var(--gold)}.code .c{color:#9A9384}.code .f{color:#8FA0FF}
.code i{font-style:normal}
#rail{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:10px}
#rail button{min-width:44px;height:44px;padding:0 12px;border:3px solid var(--ink);background:var(--card);font:700 14px var(--m);display:flex;align-items:center;gap:8px;white-space:nowrap;transition:all .5s var(--s)}
#rail button span{display:none}
#rail button.on{background:var(--ink);color:var(--gold);padding:0 16px}
#rail button.on span{display:inline}
#next{position:fixed;right:28px;bottom:28px;z-index:20;width:84px;height:84px;border:0;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p,0)*360deg),var(--ink) 0);display:grid;place-items:center}
#next b{width:68px;height:68px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font:800 30px var(--d);transition:transform .35s var(--s)}
#prev{position:fixed;right:124px;bottom:46px;z-index:20;width:48px;height:48px;border:3px solid var(--ink);background:var(--card);font:800 22px var(--d);transition:transform .3s var(--s)}
#prev:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
#sw{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex}
#sw i{flex:1;transform:translateY(100%)}
#sw i:nth-child(1){background:var(--red)}#sw i:nth-child(2){background:var(--blue)}#sw i:nth-child(3){background:var(--gold)}
#sw.on i{animation:swp .85s var(--e)}
#sw.on i:nth-child(2){animation-delay:.07s}#sw.on i:nth-child(3){animation-delay:.14s}
@keyframes swp{0%{transform:translateY(100%)}45%,55%{transform:none}100%{transform:translateY(-100%)}}
/* ---- Chapter 7: Robin Hood ---- */
.rbar{flex:0 0 21%;display:flex;gap:6px;padding-top:24px;border-bottom:3px solid var(--ink)}
.rc{position:relative;flex:1}
.rc i{position:absolute;left:10%;right:10%;bottom:0;height:calc(var(--h)/var(--mx,60)*100%);min-height:4px;background:var(--gold);border:2px solid var(--ink);transition:height .5s var(--s),background .3s}
.rc i.z{height:0;min-height:0;border:0}
.rc b{position:absolute;left:0;right:0;bottom:calc(var(--h)/var(--mx,60)*100% + 4px);text-align:center;font:500 14px/1.3 var(--m);transition:bottom .5s var(--s),background .3s}
.rc.take i,.rc.take b{background:var(--red)}
.rc.get i{background:var(--blue)}
.rc.get b{background:var(--blue);color:#fff}
.gn.sm{font-size:clamp(2.4rem,4.6vw,4.2rem)}
.gn .ar{display:inline-block;min-width:.5em;margin-left:.12em;font-size:.4em;vertical-align:.45em}
.gn.bump{animation:bump .35s var(--s)}
@keyframes bump{40%{transform:scale(1.07) rotate(-1.5deg)}}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip:disabled:hover{transform:none;box-shadow:none}
/* ---- Chapters 2, 8, 10, 11 ---- */
.br b{position:absolute;bottom:100%;left:-10%;right:-10%;margin-bottom:4px;text-align:center;font:500 14px/1.2 var(--m)}
.ax{display:flex;justify-content:space-between;border-top:3px solid var(--ink);padding-top:4px;font:500 13px var(--m);letter-spacing:.1em;transition:opacity .6s}
/* chapter 8 */
.bk{position:relative;flex:0 0 52px}
.brk{position:absolute;top:0;height:16px;border:3px solid var(--ink);border-top:0;opacity:0;transition:left .4s var(--s),width .4s var(--s),opacity .3s}
.bk span{position:absolute;top:22px;left:0;right:0;text-align:center;font:500 14px var(--m)}
.gg{flex:0 0 auto;padding-bottom:24px}
.gh{display:flex;align-items:baseline;gap:12px}
.gh b{font:800 2.6rem/1 var(--d)}
.gh span{font:500 12px var(--m);letter-spacing:.1em;color:var(--gr)}
.gt{position:relative;height:30px;margin-top:6px;border:3px solid var(--ink);background:var(--card)}
.gt i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--e,0)*100%);background:repeating-linear-gradient(45deg,var(--gold) 0 6px,var(--ink) 6px 8px);transition:width .5s var(--s)}
.gt u{position:absolute;top:-9px;bottom:-9px;left:65%;border-left:4px solid var(--red);text-decoration:none;opacity:0;transition:opacity .5s}
.gt u em{position:absolute;top:100%;left:6px;margin-top:2px;font:500 12px/1.2 var(--m);font-style:normal;color:var(--redd);white-space:nowrap}
.gg.tg .gt u{opacity:1}
/* chapter 10 */
.rul{flex:0 0 auto}
.zs{position:relative;display:flex;height:40px;margin-top:34px;border:3px solid var(--ink)}
.zs>.zn{display:flex;align-items:center;justify-content:center;border-right:3px solid var(--ink);font:500 12px var(--m);letter-spacing:.08em;overflow:hidden;white-space:nowrap}
.zs>.z4{border-right:0}
.z1{background:var(--card)}.z2{background:var(--gold)}.z3{background:var(--red)}.z4{background:var(--ink);color:var(--gold)}
.mk{position:absolute;top:50%;width:0;height:0;z-index:2;transition:opacity .5s}
.mk i{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--blue);border:3px solid var(--card);box-shadow:0 0 0 3px var(--ink);transition:transform .35s var(--s),background .3s}
.mk.on{z-index:3}
.mk.on i{background:var(--gold);border-color:var(--ink);transform:scale(1.4)}
.mk span{display:none;position:absolute;bottom:32px;left:0;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--gold);font:500 12px/1.4 var(--m);padding:1px 8px}
.mk.on span{display:block}
.rul.nm .mk{opacity:0;pointer-events:none}
.tks{position:relative;height:22px;margin:0 3px}
.tks span{position:absolute;top:4px;transform:translateX(-50%);font:500 12px var(--m)}
.bds{position:relative;height:26px;margin:4px 3px 0}
.bd2{position:absolute;top:0;height:26px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font:500 12px var(--m);white-space:nowrap;overflow:hidden;opacity:0;transition:opacity .6s}
.bd2.on{opacity:1}
.bd2.in{background:repeating-linear-gradient(45deg,var(--card) 0 6px,var(--grid) 6px 8px)}
.bd2.we{background:repeating-linear-gradient(45deg,var(--gold) 0 6px,var(--card) 6px 8px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.inf{border:3px solid var(--ink);padding:10px 12px;background:var(--card);box-shadow:6px 6px 0 var(--blue);font-size:16px;line-height:1.45}
.inf h4{font:800 1.25rem var(--d)}
.inf code{font:500 .9em var(--m);background:var(--gold);padding:0 5px}
.inf small{display:block;color:var(--gr);font-size:13px;margin-top:6px}
/* chapter 11 */
.mini{flex:0 0 11%;display:flex;gap:10px;align-items:stretch;transition:opacity .5s}
.mini.off{opacity:.3}
.mini span{flex:0 0 26px;align-self:center;font:800 1.5rem/1 var(--d)}
.mrow{flex:1;display:flex;align-items:flex-end;gap:4px;border-bottom:3px solid var(--ink)}
.mrow i{flex:1;height:calc(var(--h)*1%);min-height:4px;border:2px solid var(--ink);background:var(--blue)}
.mini.e .mrow i{background:var(--red)}
.mrow i.z{height:0;min-height:0;border:0}
/* small screens: let long stages scroll instead of squashing */
@media(max-width:900px){#app .stage{overflow:auto}.fl{min-height:170px}.mini{flex-basis:56px}}

@media(max-width:900px){
 #app .stage{left:12px!important;top:10px!important;width:calc(100vw - 24px)!important;height:44dvh!important;box-shadow:8px 8px 0 var(--c)}
 #app .cap{left:12px!important;top:calc(44dvh + 28px)!important;width:calc(100vw - 24px)!important;bottom:104px;overflow:auto}
 .cap h2{left:0!important}
 #big{display:none}
 #rail{left:12px;top:auto;bottom:14px;transform:none;flex-direction:row;gap:4px}
 #rail button{min-width:36px;padding:0 8px}
 #rail button span{display:none!important}
 #next{width:68px;height:68px;right:12px;bottom:14px}#next b{width:54px;height:54px}
 #prev{right:90px;bottom:24px}
 .tabs{width:42%}.tb{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<i class="sh" id="s1"></i><i class="sh" id="s2"></i><i class="sh" id="s3"></i><i class="sh" id="s4"></i><i class="sh" id="s5"></i>
<main id="app" data-l="A">
  <div id="big" aria-hidden="true"></div>
  <section class="stage" id="st"></section>
  <section class="cap" id="cap">
    <div class="k"><span id="kk"></span> <span id="dots"></span></div>
    <h2 id="tt"></h2>
    <div id="tx" aria-live="polite"></div>
  </section>
</main>
<nav id="rail" aria-label="Story chapters"></nav>
<button id="prev" aria-label="Previous">←</button>
<button id="next" aria-label="Next"><b>→</b></button>
<div id="sw"><i></i><i></i><i></i></div>

<script>
/* ---------- refs & math ---------- */
const gid=i=>document.getElementById(i);
const app=gid('app'),st=gid('st'),cap=gid('cap'),kk=gid('kk'),tt=gid('tt'),tx=gid('tx'),dots=gid('dots'),big=gid('big'),rail=gid('rail'),nxt=gid('next'),sw=gid('sw');
const $=s=>st.querySelector(s),sA=a=>[...a].sort((x,y)=>x-y),sum=a=>a.reduce((x,y)=>x+y,0);
const P=p=>84+480*p,Q=l=>528-480*l;
const pa=w=>w.map((q,i)=>(i?'L':'M')+P(q[0]).toFixed(1)+' '+Q(q[1]).toFixed(1)).join('');
function lz(v){const x=sA(v),t=sum(x);let c=0;return[[0,0],...x.map((e,i)=>[(i+1)/x.length,(c+=e)/t])]}
function gini(v){const x=sA(v),n=x.length;return 2*x.reduce((s,e,i)=>s+(i+1)*e,0)/(n*sum(x))-(n+1)/n}
const lab=g=>g<.2?'Very equal':g<.3?'Fairly equal':g<.4?'Moderate':g<.5?'High':g<.6?'Very high':'Extreme';
const ani=e=>{e.classList.remove('up');void e.offsetWidth;e.classList.add('up')};
function cnt(el,to,ms=1400){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);el.textContent=(to*(1-Math.pow(1-k,3))).toFixed(2);if(k<1)requestAnimationFrame(f)})(t0)}

/* ---------- chart ---------- */
function plot(w,o={}){
  const f=o.anim?'fi':'';
  let s=`<svg viewBox="0 0 600 600" role="img" aria-label="Lorenz curve chart"><defs>
  <pattern id="h" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#EA4B2A" opacity=".3"/><path d="M0 0v9" stroke="#C73A1B" stroke-width="3"/></pattern>
  <pattern id="d" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#2A3DDB" opacity=".12"/><circle cx="4.5" cy="4.5" r="1.8" fill="#2A3DDB"/></pattern></defs>`;
  [0,.25,.5,.75,1].forEach(t=>s+=`<path d="M${P(t)} ${Q(0)}V${Q(1)}M${P(0)} ${Q(t)}H${P(1)}" stroke="#D8CDB5" stroke-width="1.5"/><text x="${P(t)}" y="554" text-anchor="middle">${t*100}%</text><text x="76" y="${Q(t)+5}" text-anchor="end">${t*100}%</text>`);
  s+=`<text class="at" x="324" y="586" text-anchor="middle">CUMULATIVE SHARE OF PEOPLE →</text><text class="at" transform="translate(16 288) rotate(-90)" text-anchor="middle">CUMULATIVE SHARE OF INCOME →</text>`;
  const c=pa(w);
  if(o.A)s+=`<path class="${f}" d="${c}Z" fill="url(#h)"/>`;
  if(o.B)s+=`<path class="${f}" d="${c}L${P(1)} ${Q(0)}Z" fill="url(#d)"/>`;
  s+=o.ex||'';
  if(o.diag!==false)s+=`<path d="M${P(0)} ${Q(0)}L${P(1)} ${Q(1)}" stroke="#16130F" stroke-width="3" stroke-dasharray="10 8"/>`;
  if(!o.noc){
    s+=`<path ${o.anim?'class="draw" pathLength="1"':''} d="${c}" fill="none" stroke="#2A3DDB" stroke-width="6" stroke-linejoin="round"/>`;
    if(o.dots)w.forEach(q=>s+=`<circle class="${f}" cx="${P(q[0])}" cy="${Q(q[1])}" r="6.5" fill="#FFB81F" stroke="#16130F" stroke-width="2.5"/>`);
  }
  return s+'</svg>';
}

/* ---------- data ---------- */
const V=[55,15,10,7,5,3,2,2,1,0],VS=sA(V),PERM=[3,9,1,6,0,8,2,5,7,4];
const X5=[10,20,30,40,100];
const PY=[
{n:'Lorenz points',d:'Sort, accumulate, normalise.',c:`import numpy as np

def lorenz_curve(values):
    # cumulative share of people (p) and of income (L), poorest first
    x = np.sort(np.asarray(values, dtype=float))     # 1. line everyone up
    if x.size == 0 or np.any(x < 0) or x.sum() == 0:
        raise ValueError("Need non-negative values with a positive total.")
    L = np.insert(np.cumsum(x) / x.sum(), 0, 0.0)    # 2. cumulative income share
    p = np.linspace(0, 1, L.size)                    # 3. cumulative people share
    return p, L

incomes = [10, 20, 30, 40, 100]

{n:'Gini, three ways',d:'Area, ranks, pairs.',c:`# uses lorenz_curve and incomes from the previous tab
def gini_from_lorenz(values):
    # Gini = 1 - 2 * (area under the Lorenz curve)
    p, L = lorenz_curve(values)
    area_under = np.sum((L[1:] + L[:-1]) / 2 * np.diff(p))   # trapezoid rule
    return 1 - 2 * area_under

def gini_rank_formula(values):
    # fast version: sort, then weight each value by its rank
    x = np.sort(np.asarray(values, dtype=float))
    n = x.size
    ranks = np.arange(1, n + 1)
    return 2 * np.sum(ranks * x) / (n * x.sum()) - (n + 1) / n

def gini_pairwise(values):
    # intuitive version: mean gap between two people / (2 * mean)
    # builds an n x n table, so use the rank formula for big data
    x = np.asarray(values, dtype=float)
    gaps = np.abs(x[:, None] - x[None, :])
    return gaps.mean() / (2 * x.mean())

for f in (gini_from_lorenz, gini_rank_formula, gini_pairwise):

import pandas as pd

def weighted_gini(values, weights=None):
    v = np.asarray(values, dtype=float)
    w = np.ones_like(v) if weights is None else np.asarray(weights, dtype=float)
    order = np.argsort(v)
    v, w = v[order], w[order]
    p = np.insert(np.cumsum(w) / w.sum(), 0, 0.0)             # share of people
    L = np.insert(np.cumsum(v * w) / (v * w).sum(), 0, 0.0)   # share of income
    return 1 - 2 * np.sum((L[1:] + L[:-1]) / 2 * np.diff(p))

function show(n){
  const[si,b]=steps[n],sc=scenes[si];
  if(si!==curS){
