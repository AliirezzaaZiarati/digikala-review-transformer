{n:'Lorenz points',d:'Sort, accumulate, normalise.',c:`import numpy as np

def lorenz_curve(values):
    # cumulative share of people (p) and of income (L), poorest first
    x = np.sort(np.asarray(values, dtype=float))     # 1. line everyone up
    if x.size == 0 or np.any(x < 0) or x.sum() == 0:
        raise ValueError("Need non-negative values with a positive total.")
    L = np.insert(np.cumsum(x) / x.sum(), 0, 0.0)    # 2. cumulative income share
    p = np.linspace(0, 1, L.size)                    # 3. cumulative people share
    return p, L

def gini_from_lorenz(values):
    # Gini = 1 - 2 * (area under the Lorenz curve)
    p, L = lorenz_curve(values)
    area_under = np.sum((L[1:] + L[:-1]) / 2 * np.diff(p))   # trapezoid rule
    return 1 - 2 * area_under

def gini_rank_formula(values):
    # fast version: sort, then weight each value by its rank
    x = np.sort(np.asarray(values, dtype=float))
    n = x.size
    ranks = np.arange(1, n + 1)
    return 2 * np.sum(ranks * x) / (n * x.sum()) - (n + 1) / n

    x = np.asarray(values, dtype=float)
    gaps = np.abs(x[:, None] - x[None, :])
    return gaps.mean() / (2 * x.mean())

def weighted_gini(values, weights=None):

  tx.innerHTML=sc.beats[b];ani(tx);
  dots.innerHTML=sc.beats.map((_,i)=>`<i class="${i<=b?'on':''}"></i>`).join('');
  [...rail.children].forEach((r,i)=>r.classList.toggle('on',i==sc.a));
  nxt.style.setProperty('--p',n/(steps.length-1));
}
function go(n){
  n=Math.max(0,Math.min(steps.length-1,n));if(n===cur)return;
  const sc=scenes[steps[n][0]],pa_=cur<0?-1:scenes[steps[cur][0]].a;
  cur=n;
  if(pa_>=0&&sc.a!==pa_){sw.classList.remove('on');void sw.offsetWidth;sw.classList.add('on');setTimeout(()=>show(n),560)}

/* ---------- input ---------- */
nxt.onclick=()=>go(cur+1);gid('prev').onclick=()=>go(cur-1);

let lock=0;

  const t=Date.now();if(t-lock<750||Math.abs(e.deltaY)<20)return;

let tx0=0,ty0=0;
